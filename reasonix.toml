 \"${n},$((n+40))p\" \"$md\" | grep -nE '【|^2\\.3\\.7[23] ' | head -5", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md=\"$base/电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59/full.md\"; n=$(grep -n '^8\\.2\\.8 ' \"$md\" | head -1 | cut -d: -f1); echo \"8.2.8@$n\"; sed -n \"${n},$((n+3))p\" \"$md\" | cat -n; echo \"=== 2.3.72 题目文字后第一行 ===\"; md2=\"$base/电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b/full.md\"; n2=$(grep -n '^2\\.3\\.72 ' \"$md2\" | head -1 | cut -d: -f1); sed -n \"$((n2+1)),$((n2+6))p\" \"$md2\" | cat -n", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nfor(const id of [\"2.3.72\",\"8.2.8\",\"3.9\",\"5.1.25\"]){\n  const p=r.problems.find(x=>x.id===id);\n  console.log(\"=== \"+id+\" (len:\"+p.textLength+\") ===\");\n  console.log(\"尾部:\",JSON.stringify(p.text.slice(-100)));\n}\nconst withTag=r.problems.filter(p=>p.text.includes(\"tag{\")).map(p=>p.id);\nconsole.log(\"含 tag{ 的题目:\",withTag.join(\",\")||\"无\");\n'", "Bash=cd \"电磁学千题解做题本\" && echo \"=== 1.1.6 完整渲染 ===\"; grep -A8 '1\\.1\\.6\\.' chapters/chapter1.tex | head -12; echo; echo \"=== figures 数量对比 ===\"; node -e '\nconst r=require(\"./extract_report.json\");\nlet n=0; for(const p of r.problems) n+=p.images.length;\nconsole.log(\"报告图片数:\",n);\n'; ls figures/ | wc -l; echo \"=== 检查同名覆盖：同一题多图时 figName 序号 ===\"; grep -oE 'fig_[0-9_]+\\.jpg' chapters/chapter1.tex | sort | uniq -d | head", "Bash=cd \"电磁学千题解做题本\" && rm -f figures/*.jpg figures/*.png figures/*.jpeg && ls figures/ | wc -l && node build_chapters.js && echo \"--- 图片数核对 ---\" && ls figures/ | wc -l && node -e '\nconst r=require(\"./extract_report.json\");\nlet n=0; for(const p of r.problems) n+=p.images.length;\nconsole.log(\"报告图片数:\",n);\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst fs=require(\"fs\"),path=require(\"path\");\nconst r=require(\"./extract_report.json\");\n// 1. 收集所有章节 tex 中的 includegraphics 引用\nconst refs=[];\nfor(let ch=1;ch<=12;ch++){\n  const f=path.join(\"chapters\",\"chapter\"+ch+\".tex\");\n  if(!fs.existsSync(f)){console.log(\"!! 缺 chapter\"+ch);continue;}\n  const txt=fs.readFileSync(f,\"utf8\");\n  for(const m of txt.matchAll(/\\\\includegraphics\\[[^\\]]*\\]\\{([^}]+)\\}/g)) refs.push(m[1]);\n}\nconsole.log(\"章节中 includegraphics 引用数:\",refs.length);\n// 2. 去重并检查文件存在\nconst uniq=new Set(refs);\nlet missing=[];\nfor(const ref of uniq){\n  const f=path.join(\".\",ref);\n  if(!fs.existsSync(f)) missing.push(ref);\n}\nconsole.log(\"唯一引用:\",uniq.size,\"| 文件缺失:\",missing.length,missing.slice(0,5).join(\"; \")||\"\");\n// 3. 与报告对比：引用数 vs 报告图片数\nconst dup=refs.length-uniq.size;\nconsole.log(\"重复引用(同文件被多题使用):\",dup);\n// 4. 题目数校验\nlet probCount=0;\nfor(let ch=1;ch<=12;ch++){\n  const f=path.join(\"chapters\",\"chapter\"+ch+\".tex\");\n  const txt=fs.readFileSync(f,\"utf8\");\n  const n=(txt.match(/\\\\textbf\\{\\d+\\.\\d+(\\.\\d+)?\\.\\}/g)||[]).length;\n  probCount+=n;\n  console.log(\"chapter\"+ch+\":\",n,\"题\");\n}\nconsole.log(\"章节题目总数:\",probCount,\"| 报告:\",r.total);\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst fs=require(\"fs\");\nconst txt=fs.readFileSync(\"chapters/chapter1.tex\",\"utf8\");\nconsole.log(\"文件前 200 字符:\",JSON.stringify(txt.slice(0,200)));\nconst re=/\\\\textbf\\{\\d+\\.\\d+(\\.\\d+)?\\.\\}/g;\nconst m=txt.match(re);\nconsole.log(\"匹配数:\",m?m.length:0, \"样例:\",m?m.slice(0,3):\"\");\n// 试宽松正则\nconst re2=/\\\\textbf\\{/g;\nconsole.log(\"\\\\textbf{ 出现次数:\",(txt.match(re2)||[]).length);\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst fs=require(\"fs\");\nconst txt=fs.readFileSync(\"chapters/chapter1.tex\",\"utf8\");\nconsole.log(\"indexOf backslash:\",txt.indexOf(\"\\\\\"));\nconsole.log(\"indexOf textbf:\",txt.indexOf(\"textbf\"));\nconsole.log(\"第一个字符码:\",txt.charCodeAt(0),txt.charCodeAt(1),txt.charCodeAt(2));\nconsole.log(\"slice(0,20):\",JSON.stringify(txt.slice(0,20)));\n'", "Bash=cd \"电磁学千题解做题本\" && cat > /tmp/t.js <<'EOF'\nconst fs=require(\"fs\");\nconst txt=fs.readFileSync(\"chapters/chapter1.tex\",\"utf8\");\nconsole.log(\"re1:\", (txt.match(/\\\\textbf\\{/g)||[]).length);\nconsole.log(\"re2:\", (txt.match(/\\\\textbf\\{\\d+\\.\\d+\\.\\d+\\.\\}/g)||[]).length);\nconsole.log(\"re3:\", (txt.match(/\\\\textbf\\{\\d+\\.\\d+(\\.\\d+)?\\.\\}/g)||[]).length);\nEOF\nnode /tmp/t.js; rm -f /tmp/t.js", "Bash=cd \"电磁学千题解做题本\" && node -e \"const fs=require('fs');const txt=fs.readFileSync('chapters/chapter1.tex','utf8');console.log('idx:',txt.indexOf('\\\\\\\\textbf{'));console.log('includes:',txt.includes('\\\\\\\\textbf{'));console.log('charAt0-8:',JSON.stringify(txt.slice(0,8)));\"", "Bash=cd \"电磁学千题解做题本\" && cat > /tmp/check.js <<'EOF'\nconst fs = require(\"fs\"), path = require(\"path\");\nconst r = require(\"./extract_report.json\");\n// 1. includegraphics 引用统计\nlet refs = [], probCount = 0;\nfor (let ch = 1; ch <= 12; ch++) {\n  const f = path.join(\"chapters\", \"chapter\" + ch + \".tex\");\n  const txt = fs.readFileSync(f, \"utf8\");\n  for (const m of txt.matchAll(/\\\\includegraphics\\[[^\\]]*\\]\\{([^}]+)\\}/g)) refs.push(m[1]);\n  probCount += (txt.match(/\\\\textbf\\{\\d+\\.\\d+(\\.\\d+)?\\.\\}/g) || []).length;\n}\nconst uniq = new Set(refs);\nlet missing = [];\nfor (const ref of uniq) if (!fs.existsSync(path.join(\".\", ref))) missing.push(ref);\nconsole.log(\"includegraphics 引用:\", refs.length, \"| 唯一:\", uniq.size, \"| 文件缺失:\", missing.length, missing.join(\"; \") || \"\");\nconsole.log(\"章节题目总数:\", probCount, \"| 报告:\", r.total);\nEOF\nnode /tmp/check.js; rm -f /tmp/check.js", "Bash=cd \"电磁学千题解做题本\" && cat > check.js <<'EOF'\nconst fs = require(\"fs\"), path = require(\"path\");\nconst r = require(\"./extract_report.json\");\nlet refs = [], probCount = 0;\nfor (let ch = 1; ch <= 12; ch++) {\n  const f = path.join(\"chapters\", \"chapter\" + ch + \".tex\");\n  const txt = fs.readFileSync(f, \"utf8\");\n  for (const m of txt.matchAll(/\\\\includegraphics\\[[^\\]]*\\]\\{([^}]+)\\}/g)) refs.push(m[1]);\n  probCount += (txt.match(/\\\\textbf\\{\\d+\\.\\d+(\\.\\d+)?\\.\\}/g) || []).length;\n}\nconst uniq = new Set(refs);\nlet missing = [];\nfor (const ref of uniq) if (!fs.existsSync(path.join(\".\", ref))) missing.push(ref);\nconsole.log(\"includegraphics 引用:\", refs.length, \"| 唯一:\", uniq.size, \"| 文件缺失:\", missing.length, missing.join(\"; \") || \"\");\nconsole.log(\"章节题目总数:\", probCount, \"| 报告:\", r.total);\nEOF\nnode check.js && rm -f check.js", "Bash=cd \"电磁学千题解做题本\" && cat > diag.js <<'EOF'\nconst fs = require(\"fs\");\nconst txt = fs.readFileSync(\"chapters/chapter1.tex\", \"utf8\");\nconsole.log(\"len:\", txt.length);\nconsole.log(\"charCode 0-10:\", [...txt.slice(0,10)].map(c=>c.charCodeAt(0)).join(\",\"));\nconsole.log(\"slice(0,20):\", JSON.stringify(txt.slice(0,20)));\nconsole.log(\"indexOf('\\\\\\\\textbf{'):\", txt.indexOf(\"\\\\textbf{\"));\nconsole.log(\"match /\\\\\\\\textbf\\\\{/g:\", (txt.match(/\\\\textbf\\{/g)||[]).length);\nconsole.log(\"match /\\\\\\\\textbf/g:\", (txt.match(/\\\\textbf/g)||[]).length);\n// 直接看第一行\nconst firstLine = txt.split(\"\\n\")[0];\nconsole.log(\"firstLine:\", JSON.stringify(firstLine));\nconsole.log(\"firstLine.startsWith('\\\\\\\\textbf'):\", firstLine.startsWith(\"\\\\textbf\"));\nEOF\nnode diag.js && rm -f diag.js", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst fs=require(\"fs\");\nconst txt=fs.readFileSync(\"chapters/chapter1.tex\",\"utf8\");\nconsole.log(\"startsWith:\", txt.startsWith(\"\\\\textbf\"));\nconsole.log(\"count \\\\textbf:\", (txt.split(\"\\\\textbf\").length-1));\nconsole.log(\"regex count:\", (txt.match(/\\u005ctextbf/g)||[]).length);\n'", "Bash=cd \"电磁学千题解做题本\" && cat > check2.js <<'EOF'\nconst fs = require(\"fs\"), path = require(\"path\");\nconst r = require(\"./extract_report.json\");\nlet refs = [], probCount = 0, chapCounts = [];\nfor (let ch = 1; ch <= 12; ch++) {\n  const f = path.join(\"chapters\", \"chapter\" + ch + \".tex\");\n  const txt = fs.readFileSync(f, \"utf8\");\n  const inc = (txt.match(/\\\\includegraphics/g) || []).length;\n  const probs = (txt.match(/\\\\textbf\\{\\d+\\.\\d+(\\.\\d+)?\\.\\}/g) || []).length;\n  refs.push(inc); probCount += probs;\n  chapCounts.push({ch, inc, probs});\n}\nconsole.log(\"各章 includegraphics 数:\", chapCounts.map(c=>c.ch+\":\"+c.inc).join(\" \"));\nconsole.log(\"includegraphics 总计:\", refs.reduce((a,b)=>a+b,0));\nconsole.log(\"章节题目总数:\", probCount, \"| 报告:\", r.total);\n// 报告中的图片数\nconsole.log(\"报告图片数:\", r.problems.reduce((a,p)=>a+p.images.length,0));\nEOF\nnode check2.js && rm -f check2.js", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nconst p=r.problems.find(x=>x.id===\"2.3.41\");\nconsole.log(JSON.stringify(p.text));\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\n// 找到含 \\- 的题目（文本模式反斜杠）\nfor(const p of r.problems){\n  if(/[^\\\\$]\\\\-/.test(p.text.replace(/\\$\\$?/g,\"\")) && p.text.includes(\"\\\\-\")){\n    console.log(p.id, \":\", JSON.stringify(p.text.slice(0,120)));\n  }\n}\n' 2>/dev/null | head -6", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nconst p=r.problems.find(x=>x.id===\"1.3.7\");\nif(p) console.log(\"1.3.7:\",JSON.stringify(p.text.slice(0,200)));\n// 找文本模式 \\- 的实际内容\nfor(const p of r.problems){\n  const lines=p.text.split(\"\\n\");\n  for(const l of lines){\n    // 在数学模式外的 \\-\n    let inM=false;\n    for(let i=0;i<l.length;i++){\n      if(l[i]===\"$\"){ inM=!inM; continue; }\n      if(!inM && l[i]===\"\\\\\" && l[i+1]===\"-\"){\n        console.log(p.id, \"行:\", JSON.stringify(l.slice(Math.max(0,i-15), i+15)));\n      }\n    }\n  }\n}\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\n// 找含 【 的题目文本\nconst withB=r.problems.filter(p=>p.text.includes(\"【\")).map(p=>p.id);\nconsole.log(\"含【的题目:\",withB.join(\",\")||\"无\");\nfor(const id of withB.slice(0,5)){\n  const p=r.problems.find(x=>x.id===id);\n  const idx=p.text.indexOf(\"【\");\n  console.log(id, \":\", JSON.stringify(p.text.slice(Math.max(0,idx-60), idx+80)));\n}\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; echo \"=== 1.4.19 源文 ===\"; grep -n '1\\.4\\.19 ' \"$base/电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429/full.md\" | head -2; md=\"$base/电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429/full.md\"; n=$(grep -n '^1\\.4\\.19 ' \"$md\" | head -1 | cut -d: -f1); sed -n \"${n},$((n+8))p\" \"$md\" | cat -n; echo; echo \"=== 11.49 源文 ===\"; md2=\"$base/电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459/full.md\"; n2=$(grep -n '^11\\.49 ' \"$md2\" | head -1 | cut -d: -f1); sed -n \"${n2},$((n2+6))p\" \"$md2\" | cat -n", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconst withB=r.problems.filter(p=>p.text.includes(\"【\")).map(p=>p.id);\nconsole.log(\"含【的题目:\",withB.join(\",\")||\"无\");\nconst p19=r.problems.find(x=>x.id===\"1.4.19\");\nconsole.log(\"1.4.19 尾部:\",JSON.stringify(p19.text.slice(-80)));\nconst p49=r.problems.find(x=>x.id===\"11.49\");\nconsole.log(\"11.49 尾部:\",JSON.stringify(p49.text.slice(-80)));\n'", "Bash=cd /tmp && cat > tagtest.tex <<'EOF'\n\\documentclass{article}\n\\usepackage{amsmath}\n\\begin{document}\n$$\nW = \\int u \\mathrm{d} q\\tag{I}\n$$\n$$\nW = \\frac {1}{2} \\int U \\mathrm{d} q\\tag{Ⅱ}\n$$\n\\end{document}\nEOF\nxelatex -interaction=nonstopmode -halt-on-error tagtest.tex 2>&1 | grep -E '^!|Output' | head -5; rm -f tagtest.*", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && awk 'NR<=1856' main.log | grep -n 'chapter[0-9]*\\.tex' | tail -2; echo \"--- 检查 chapter 中 1174 附近 ---\"; for f in chapters/chapter*.tex; do n=$(wc -l < \"$f\"); if [ \"$n\" -ge 1170 ]; then echo \"$f ($n 行)\"; sed -n '1165,1178p' \"$f\" | cat -n | head -16; fi; done", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nconst p=r.problems.find(x=>x.id===\"4.3.9\");\nconsole.log(\"=== 4.3.9 ===\");\nconsole.log(JSON.stringify(p.text));\n// 检查所有题目文本中残留的未闭合 $$ \nfor(const p of r.problems){\n  const n=(p.text.match(/\\$\\$/g)||[]).length;\n  if(n%2===1) console.log(\"未配对$$:\",p.id);\n}\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md=\"$base/电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b/full.md\"; n=$(grep -n '^4\\.3\\.9 ' \"$md\" | head -1 | cut -d: -f1); sed -n \"${n},$((n+6))p\" \"$md\" | cat -n", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node extract.js >/dev/null 2>&1 && node -e '\nconst r=require(\"./extract_report.json\");\nconst bad=r.problems.filter(p=>{\n  const n=(p.text.match(/\\$\\$/g)||[]).length;\n  return n%2===1;\n}).map(p=>p.id);\nconsole.log(\"未配对$$题目:\",bad.join(\",\")||\"无\");\nconst p=r.problems.find(x=>x.id===\"4.3.9\");\nconsole.log(\"4.3.9 尾部:\",JSON.stringify(p.text.slice(-60)));\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && grep -n -B3 -A3 'tag not allowed' main.log | head -15; echo \"--- 属于哪个文件 ---\"; awk '/tag not allowed/{found=NR} END{}' main.log; grep -n 'chapter[0-9]*\\.tex' main.log | awk -F: '$1<='\"$(grep -n 'tag not allowed' main.log | head -1 | cut -d: -f1)\"' {last=$0} END{print last}'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > imgsize.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst dir = 'figures';\nconst files = fs.readdirSync(dir).filter(f => /\\.(jpg|jpeg|png)$/i.test(f));\n\nfunction jpegSize(buf) {\n  let i = 2;\n  while (i < buf.length) {\n    if (buf[i] !== 0xFF) { i++; continue; }\n    const marker = buf[i + 1];\n    if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {\n      return { w: buf.readUInt16BE(i + 5), h: buf.readUInt16BE(i + 7) };\n    }\n    const len = buf.readUInt16BE(i + 2);\n    i += 2 + len;\n  }\n  return null;\n}\nfunction pngSize(buf) {\n  if (buf.length < 24) return null;\n  return { w: buf.readUInt32BE(16), h: buf.readUInt32BE(20) };\n}\n\nconst sizes = [];\nfor (const f of files) {\n  const buf = fs.readFileSync(path.join(dir, f));\n  let s = null;\n  if (buf[0] === 0xFF && buf[1] === 0xD8) s = jpegSize(buf);\n  else if (buf[0] === 0x89 && buf[1] === 0x50) s = pngSize(buf);\n  if (s) sizes.push({ f, ...s, ratio: s.h / s.w });\n}\nconsole.log('图片总数:', files.length, '| 可解析尺寸:', sizes.length);\n// 按宽高比排序：非常高(ratio>2.5) 和 非常宽(ratio<0.4)\nconst tall = sizes.filter(s => s.ratio > 2.5).sort((a,b)=>b.ratio-a.ratio);\nconst wide = sizes.filter(s => s.ratio < 0.4).sort((a,b)=>a.ratio-b.ratio);\nconsole.log('--- 高图 (h/w > 2.5):', tall.length, '张 ---');\ntall.slice(0,12).forEach(s => console.log(' ', s.f, s.w+'x'+s.h, 'ratio='+s.ratio.toFixed(2)));\nconsole.log('--- 宽图 (h/w < 0.4):', wide.length, '张 ---');\nwide.slice(0,12).forEach(s => console.log(' ', s.f, s.w+'x'+s.h, 'ratio='+s.ratio.toFixed(2)));\n// 一般分布\nconst buckets = {};\nfor (const s of sizes) {\n  const b = s.ratio < 0.5 ? '<0.5' : s.ratio < 1 ? '0.5-1' : s.ratio < 2 ? '1-2' : s.ratio < 3 ? '2-3' : '>3';\n  buckets[b] = (buckets[b] || 0) + 1;\n}\nconsole.log('宽高比分布:', JSON.stringify(buckets));\nEOF\nnode imgsize.js", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && echo \"=== log 中所有 Overfull 是否为文字段落（非图片）===\"; grep -B1 'Overfull' main.log | grep -iE 'hbox|vbox' | head -8; echo; echo \"=== 检查图片相关警告（Not found / missing）===\"; grep -iE 'missing|not found|cannot' main.log | head -5 || echo \"无\"; echo; echo \"=== 超宽图(ratio<0.4)渲染：0.3 宽仍小于行宽，无溢出 ===\"; node -e '\nconst fs=require(\"fs\");\n// 确认 4 张超宽图也应用了 keepaspectratio\nfor(const f of [\"fig_6_1_32_1.jpg\",\"fig_4_2_1.jpg\",\"fig_1_2_34_1.jpg\",\"fig_6_2_41.jpg\"]){\n  const found=[];\n  for(let ch=1;ch<=12;ch++){\n    const t=fs.readFileSync(\"chapters/chapter\"+ch+\".tex\",\"utf8\");\n    const m=t.match(new RegExp(\"includegraphics\\\\[[^\\\\]]*\\\\]\\\\{figures/\"+f+\"\\\\}\"));\n    if(m) found.push(m[0]);\n  }\n  console.log(f, \"->\", found.join(\" \")||\"未找到\");\n}\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && rm -f imgsize.js && echo \"=== 确认所有 includegraphics 都带 keepaspectratio ===\"; grep -h 'includegraphics' chapters/*.tex | grep -vc 'keepaspectratio'; echo \"（0 = 全部已应用）\"; echo \"=== 超高图约束数学验证 ===\"; node -e '\n// 文本区高 25.7cm，0.6 约束 => 最大渲染高 15.42cm\n// 之前 76 张高图 ratio>2.5 中 ratio>3.1 的会被 height 约束（宽度=15.42/ratio cm）\nconst cases=[[\"fig_7_2_1.jpg\",8.32],[\"fig_4_1_12_2.jpg\",8.14],[\"fig_4_2_19.jpg\",6.58],[\"fig_3_5.jpg\",5.78],[\"fig_2_3_4.jpg\",7.39]];\nfor(const [f,r] of cases){\n  const w=15.42/r, h=15.42;\n  console.log(f, \"ratio=\"+r, \"-> 渲染宽=\"+w.toFixed(1)+\"cm 高=\"+h.toFixed(1)+\"cm (上限 15.4cm) ✓\");\n}\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > check_tall.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst dir = 'figures';\nfunction jpegSize(buf){let i=2;while(i<buf.length){if(buf[i]!==0xFF){i++;continue;}const m=buf[i+1];if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){return{w:buf.readUInt16BE(i+5),h:buf.readUInt16BE(i+7)}}const l=buf.readUInt16BE(i+2);i+=2+l;}return null;}\nfunction pngSize(buf){if(buf.length<24)return null;return{w:buf.readUInt32BE(16),h:buf.readUInt32BE(20)};}\nconst tall=[];\nfor(const f of fs.readdirSync(dir)){\n  const buf=fs.readFileSync(path.join(dir,f));\n  let s=null;\n  if(buf[0]===0xFF&&buf[1]===0xD8)s=jpegSize(buf);\n  else if(buf[0]===0x89&&buf[1]===0x50)s=pngSize(buf);\n  if(s){const r=s.h/s.w; if(r>4) tall.push({f,w:s.w,h:s.h,r});}\n}\ntall.sort((a,b)=>b.r-a.r);\nconsole.log('ratio>4 的高图:', tall.length, '张');\nconsole.log('ratio 3~4:', require('fs').readdirSync(dir).filter(f=>{const b=fs.readFileSync(path.join(dir,f));let s;if(b[0]===0xFF)s=jpegSize(b);else if(b[0]===0x89)s=pngSize(b);return s&&s.h/s.w>3&&s.h/s.w<=4;}).length, '张');\nEOF\nnode check_tall.js && rm -f check_tall.js", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && echo \"=== 各种矢量宏出现次数（全部章节）===\"; for macro in 'boldsymbol' 'mathbf' 'pmb' 'vec' 'bm{' 'hat'; do n=$(grep -oh \"\\\\\\\\${macro}\" chapters/*.tex | wc -l); echo \"$macro: $n\"; done; echo; echo \"=== 抽样：各宏的典型用法 ===\"; echo \"--- boldsymbol ---\"; grep -oh '\\\\boldsymbol{[^}]*}' chapters/chapter1.tex | sort | uniq -c | sort -rn | head -8; echo \"--- mathbf ---\"; grep -oh '\\\\mathbf{[^}]*}' chapters/chapter1.tex | sort | uniq -c | sort -rn | head -8; echo \"--- pmb ---\"; grep -oh '\\\\pmb{[^}]*}' chapters/chapter1.tex | sort | uniq -c | sort -rn | head -8; echo \"--- vec ---\"; grep -oh '\\\\vec{[^}]*}' chapters/chapter1.tex | sort | uniq -c | sort -rn | head -8; echo \"--- hat ---\"; grep -oh '\\\\hat{[^}]*}' chapters/chapter1.tex | sort | uniq -c | sort -rn | head -8", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > fix_vec.js <<'EOF'\n// fix_vec.js — 统一矢量表述：\n//   \\pmb{X} / \\mathbf{X} / \\boldsymbol {X} / \\boldsymbol{X}  => \\vec{X}\n//   单位矢量 e_{r} / e _ {r} / e_{\\omega} / e_{I} / e_{B}     => \\hat{e}_{...}\n//   \\vec{X} / \\hat{i} / \\hat{j} 保持不变\nconst fs = require('fs'), path = require('path');\n\nconst chapters = fs.readdirSync('chapters').filter(f => f.endsWith('.tex'));\nlet stats = { pmb: 0, mathbf: 0, boldsymbol: 0, hat_e: 0 };\n\nfor (const f of chapters) {\n  const file = path.join('chapters', f);\n  let t = fs.readFileSync(file, 'utf8');\n\n  // 1. \\pmb{X} -> \\vec{X}\n  t = t.replace(/\\\\pmb\\s*\\{([^}]*)\\}/g, (m, x) => { stats.pmb++; return '\\\\vec{' + x + '}'; });\n\n  // 2. \\mathbf{X} -> \\vec{X}\n  t = t.replace(/\\\\mathbf\\s*\\{([^}]*)\\}/g, (m, x) => { stats.mathbf++; return '\\\\vec{' + x + '}'; });\n\n  // 3. \\boldsymbol {X} / \\boldsymbol{X} -> \\vec{X}\n  t = t.replace(/\\\\boldsymbol\\s*\\{([^}]*)\\}/g, (m, x) => { stats.boldsymbol++; return '\\\\vec{' + x + '}'; });\n\n  // 4. 单位矢量 e_{...} -> \\hat{e}_{...}（e 后可选空格，下标为单字母/词）\n  t = t.replace(/e\\s*_\\s*\\{([^}]*)\\}/g, (m, x) => { stats.hat_e++; return '\\\\hat{e}_{' + x + '}'; });\n\n  fs.writeFileSync(file, t, 'utf8');\n}\nconsole.log('处理完成：');\nconsole.log('  \\\\pmb -> \\\\vec:', stats.pmb, '处');\nconsole.log('  \\\\mathbf -> \\\\vec:', stats.mathbf, '处');\nconsole.log('  \\\\boldsymbol -> \\\\vec:', stats.boldsymbol, '处');\nconsole.log('  e_{...} -> \\\\hat{e}_{...}:', stats.hat_e, '处');\nEOF\nnode fix_vec.js", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst s='\\''\\\\boldsymbol {E} = x'\\'';\nconsole.log(\"测试1 带空格:\", s.replace(/\\\\boldsymbol\\s*\\{([^}]*)\\}/g, \"VEC<$1>\"));\nconst t='\\''\\\\boldsymbol{E} = x'\\'';\nconsole.log(\"测试2 无空格:\", t.replace(/\\\\boldsymbol\\s*\\{([^}]*)\\}/g, \"VEC<$1>\"));\n'; echo \"=== 源文件实际字节（chapter1 195 行）===\"; sed -n '195p' chapters/chapter1.tex | head -c 80 | od -c | head -3", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > fix_vec2.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst chapters = fs.readdirSync('chapters').filter(f => f.endsWith('.tex'));\nlet total = { pmb: 0, mathbf: 0, boldsymbol: 0, hat_e: 0 };\nfor (const f of chapters) {\n  const file = path.join('chapters', f);\n  let t = fs.readFileSync(file, 'utf8');\n  const before_bs = (t.match(/\\\\boldsymbol/g) || []).length;\n  t = t.replace(/\\\\boldsymbol\\s*\\{([^}]*)\\}/g, (m, x) => { total.boldsymbol++; return '\\\\vec{' + x + '}'; });\n  const after_bs = (t.match(/\\\\boldsymbol/g) || []).length;\n  if (before_bs > 0) console.log(f, 'boldsymbol:', before_bs, '->', after_bs);\n  fs.writeFileSync(file, t, 'utf8');\n}\nconsole.log('total boldsymbol replaced:', total.boldsymbol);\nEOF\nnode fix_vec2.js; echo \"=== 重新检查残留 ===\"; grep -c 'boldsymbol' chapters/*.tex | grep -v ':0' || echo \"全部替换完成\"", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst fs = require(\"fs\");\nconst t = fs.readFileSync(\"chapters/chapter1.tex\", \"utf8\");\nconst m = t.match(/\\\\boldsymbol/g);\nconsole.log(\"match count:\", m ? m.length : 0);\n// 逐个 boldsymbol 上下文\nlet idx = 0, i = 0;\nwhile ((idx = t.indexOf(\"boldsymbol\", idx)) >= 0) {\n  console.log(i++, \"ctx:\", JSON.stringify(t.slice(idx - 2, idx + 14)));\n  idx += 10;\n}\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst fs = require(\"fs\");\nconst t = fs.readFileSync(\"chapters/chapter1.tex\", \"utf8\");\nconst idx = t.indexOf(\"boldsymbol\");\nconsole.log(\"boldsymbol 前字符码点:\", t.charCodeAt(idx - 1).toString(16), \"(\" + t[idx-1] + \")\");\nconsole.log(\"反斜杠 U+005C 对照:\", \"\\\\\".charCodeAt(0).toString(16));\n// 统计该文件中的反斜杠种类\nconst counts = {};\nfor (const ch of t) {\n  const c = ch.charCodeAt(0);\n  if (c === 0x5c || c === 0xff3c || (c >= 0xe000 && c <= 0xf8ff)) {\n    counts[c.toString(16)] = (counts[c.toString(16)] || 0) + 1;\n  }\n}\nconsole.log(\"反斜杠类字符分布:\", JSON.stringify(counts));\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > diag2.js <<'EOF'\nconst fs = require(\"fs\");\nconst t = fs.readFileSync(\"chapters/chapter1.tex\", \"utf8\");\nconst re = /\\\\boldsymbol\\s*\\{([^}]*)\\}/g;\nlet m, n = 0;\nwhile ((m = re.exec(t)) !== null) { n++; }\nconsole.log(\"regex exec count:\", n);\nconst re2 = new RegExp(\"\\\\\\\\boldsymbol\", \"g\");\nlet n2 = 0;\nwhile (re2.exec(t) !== null) n2++;\nconsole.log(\"RegExp ctor count:\", n2);\nconsole.log(\"indexOf boldsymbol count:\", t.split(\"boldsymbol\").length - 1);\n// 打印第一处完整\nconst i = t.indexOf(\"boldsymbol\");\nconsole.log(\"slice:\", JSON.stringify(t.slice(i - 1, i + 20)));\nEOF\nnode diag2.js", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node -e '\nconst fs = require(\"fs\");\nconst t = fs.readFileSync(\"chapters/chapter1.tex\", \"utf8\");\nconst i = t.indexOf(\"boldsymbol\");\n// 打印前 8 个字符的码点\nconsole.log(\"码点:\", [...t.slice(i-3, i+3)].map(c => c.charCodeAt(0).toString(16)).join(\" \"));\nconsole.log(\"原始:\", JSON.stringify(t.slice(i-3, i+3)));\n'", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > diag3.js <<'EOF'\nconst fs = require(\"fs\");\nconst t = fs.readFileSync(\"chapters/chapter1.tex\", \"utf8\");