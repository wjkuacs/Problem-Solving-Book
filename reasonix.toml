Sync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  const chTitles={}; const two={}; const three={};\n  for(const l of lines){\n    const ct=l.match(/^## 第([一二三四五六七八九十]+)章/);\n    if(ct){ chTitles[ct[1]]=l.trim(); }\n    const m3=l.match(threeRe);\n    if(m3 && !/^(所示|如图|见图|图\\d)/.test(l.replace(m3[0],\"\").trim())){ three[m3[0]]=(three[m3[0]]||0)+1; }\n    const m2=l.match(twoRe);\n    if(m2 && !/^(所示|如图|见图|图\\d)/.test(l.replace(m2[0],\"\").trim())){ two[m2[0]]=(two[m2[0]]||0)+1; }\n  }\n  console.log(\"=== \"+d.slice(0,14)+\" ===\");\n  console.log(\"章标题:\",JSON.stringify(chTitles,null,0));\n  console.log(\"两级题号 数量:\",Object.keys(two).length,\"| 重复:\",Object.entries(two).filter(([k,v])=>v>1).map(([k,v])=>k+\"x\"+v).join(\",\")||\"无\");\n  console.log(\"三级题号 数量:\",Object.keys(three).length,\"| 重复:\",Object.entries(three).filter(([k,v])=>v>1).map(([k,v])=>k+\"x\"+v).join(\",\")||\"无\");\n  console.log(\"两级首尾:\",Object.keys(two).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).slice(0,3).join(\",\"),\"~\",Object.keys(two).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).slice(-3).join(\",\"));\n  console.log(\"三级首尾:\",Object.keys(three).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).slice(0,3).join(\",\"),\"~\",Object.keys(three).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).slice(-3).join(\",\"));\n}\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; node -e '\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst twoRe=/^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst threeRe=/^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst chapNum={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12};\nlet perChapter={};\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  let curChapter=null;\n  for(const l of lines){\n    const ct=l.match(/^## 第([一二三四五六七八九十]+)章\\s+(\\S+)/);\n    if(ct) curChapter=chapNum[ct[1]];\n    const m3=l.match(threeRe);\n    const m2=l.match(twoRe);\n    let prob=null;\n    if(m3 && !/^(所示|如图|见图|图\\d)/.test(l.replace(m3[0],\"\").trim())) prob=m3[0];\n    else if(m2 && !/^(所示|如图|见图|图\\d)/.test(l.replace(m2[0],\"\").trim())) prob=m2[0];\n    if(prob){\n      const ch=parseInt(prob.split(\".\")[0],10);\n      // 两级题号只允许 3/7/9/10/11 章；三级题号不允许这些章（防止误匹配如 9.1.1 不存在）\n      if(m3 && [3,7,9,10,11].includes(ch)) continue;\n      if(m2 && ![3,7,9,10,11].includes(ch)) continue;\n      if(!perChapter[ch]) perChapter[ch]={count:0,ids:[],chapterTitle:curChapter};\n      perChapter[ch].count++;\n      perChapter[ch].ids.push(prob);\n    }\n  }\n}\nlet total=0;\nfor(let ch=1;ch<=12;ch++){\n  if(perChapter[ch]){ total+=perChapter[ch].count; console.log(\"第\"+ch+\"章:\",perChapter[ch].count,\"题 |\",perChapter[ch].ids[0],\"~\",perChapter[ch].ids[perChapter[ch].ids.length-1]); }\n  else console.log(\"第\"+ch+\"章: 缺失\");\n}\nconsole.log(\"合计:\",total);\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; node -e '\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst twoRe=/^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst threeRe=/^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst chapNum={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12};\nconst titles={};\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  for(const l of lines){ const ct=l.match(/^## 第([一二三四五六七八九十]+)章\\s*(.*)/); if(ct) titles[chapNum[ct[1]]]=ct[2].trim(); }\n}\nconsole.log(\"章节标题:\",JSON.stringify(titles));\n// 检查每章题号连续性\nconst perChapter={};\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  let curChapter=null;\n  for(const l of lines){\n    const ct=l.match(/^## 第([一二三四五六七八九十]+)章/);\n    if(ct) curChapter=chapNum[ct[1]];\n    const m3=l.match(threeRe), m2=l.match(twoRe);\n    let prob=null;\n    if(m3 && !/^(所示|如图|见图|图\\d)/.test(l.replace(m3[0],\"\").trim())) prob=m3[0];\n    else if(m2 && !/^(所示|如图|见图|图\\d)/.test(l.replace(m2[0],\"\").trim())) prob=m2[0];\n    if(prob){\n      const ch=parseInt(prob.split(\".\")[0],10);\n      if(m3 && [3,7,9,10,11].includes(ch)) continue;\n      if(m2 && ![3,7,9,10,11].includes(ch)) continue;\n      if(!perChapter[ch]) perChapter[ch]=new Set();\n      perChapter[ch].add(prob);\n    }\n  }\n}\nfor(let ch=1;ch<=12;ch++){\n  if(!perChapter[ch]){ console.log(\"第\"+ch+\"章: 缺失\"); continue; }\n  const ids=[...perChapter[ch]].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));\n  // 找缺失\n  const missing=[];\n  if([3,7,9,10,11].includes(ch)){\n    for(let i=1;i<=100;i++){ const id=ch+\".\"+i; if(!perChapter[ch].has(id)) missing.push(id); }\n    // 只显示范围内的缺失\n    const first=ids[0],last=ids[ids.length-1];\n    const fn=parseInt(first.split(\".\")[1],10), ln=parseInt(last.split(\".\")[1],10);\n    const inRange=missing.filter(m=>{const n=parseInt(m.split(\".\")[1],10);return n>fn&&n<ln;});\n    console.log(\"第\"+ch+\"章(\"+titles[ch]+\"): \"+ids.length+\"题 | \"+first+\"~\"+last+\" | 范围内缺失: \"+inRange.join(\",\")||\"无\");\n  } else {\n    // 三级：按节检查\n    console.log(\"第\"+ch+\"章(\"+titles[ch]+\"): \"+ids.length+\"题 | \"+ids[0]+\"~\"+ids[ids.length-1]);\n  }\n}\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md9=\"$base/电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459/full.md\"; echo \"=== 9.20 是否存在（任意位置）===\"; grep -n '9\\.20' \"$md9\" | head -5; echo; echo \"=== 9.19 与 9.21 之间内容 ===\"; n19=$(grep -n '^9\\.19 ' \"$md9\" | head -1 | cut -d: -f1); n21=$(grep -n '^9\\.