nalyze.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst base = 'D:/Program Files/Mineru/新建文件夹';\nconst dirs = [\n  '电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459',\n  '电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59',\n  '电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b',\n  '电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429',\n];\nconst CHAP_NUM = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10, 十一: 11, 十二: 12 };\nconst TWO_LEVEL = new Set([3, 7, 9, 10, 11]);\nconst SOL = /^\\s*#{0,3}\\s*【\\s*(解|证|解答|论证)\\s*[】\\}\\]\\s]*/;\nconst TWO_RE = /^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst THREE_RE = /^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst LEAD_CAP = /^图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\(\\d+\\))?\\s+/;\nconst IMG = /!\\[[^\\]]*\\]\\(([^)]+)\\)/g;\n\n// 每个题：题目区内出现的图片引用（file 列表）+ 题目文字是否含\"如图x.y.z\"字样\nconst stats = { total: 0, withImgRef: 0, imgRefCount: 0, mentionOnly: 0 };\nconst mentionRe = /图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\([0-9]+\\))?/;\n\nfor (const d of dirs) {\n  const lines = fs.readFileSync(path.join(base, d, 'full.md'), 'utf8').split('\\n');\n  let cur = null, last = null;\n  for (const l of lines) {\n    let id = null, isTwo = false;\n    let w = l;\n    const lc = l.match(LEAD_CAP);\n    if (lc) w = l.slice(lc[0].length);\n    const m3 = w.match(THREE_RE), m2 = w.match(TWO_RE);\n    if (m3) id = m3[0];\n    else if (m2) { id = m2[0]; isTwo = true; }\n    if (id) {\n      const ch = parseInt(id.split('.')[0], 10);\n      if ((isTwo && !TWO_LEVEL.has(ch)) || (!isTwo && TWO_LEVEL.has(ch))) id = null;\n    }\n    if (id) {\n      const rest = w.replace(id, '').trim();\n      if (cur && id === last && /^(所示|图\\s*\\d)/.test(rest)) { cur.text += ' ' + rest; continue; }\n      if (cur) stats.total++;\n      cur = { id, text: rest, imgs: [], inSol: false };\n      last = id;\n      continue;\n    }\n    if (cur && !cur.inSol) {\n      if (SOL.test(l.trim())) { cur.inSol = true; continue; }\n      const im = l.match(/【\\s*(解|证|解答|论证)\\s*[】\\}\\]\\s]*/);\n      if (im) { cur.inSol = true; continue; }\n      cur.text += '\\n' + l;\n      for (const m of l.matchAll(IMG)) cur.imgs.push(m[1]);\n    }\n  }\n  if (cur) stats.total++;\n  for (const p of []) {}\n}\nconsole.log('（重新扫描中——见下）');\nEOF\nnode analyze.js 2>/dev/null || echo \"（占位，改用直接统计）\"", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > analyze2.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst base = 'D:/Program Files/Mineru/新建文件夹';\nconst dirs = [\n  '电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459',\n  '电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59',\n  '电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b',\n  '电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429',\n];\nconst CHAP_NUM = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10, 十一: 11, 十二: 12 };\nconst TWO_LEVEL = new Set([3, 7, 9, 10, 11]);\nconst SOL = /^\\s*#{0,3}\\s*【\\s*(解|证|解答|论证)\\s*[】\\}\\]\\s]*/;\nconst TWO_RE = /^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst THREE_RE = /^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst LEAD_CAP = /^图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\(\\d+\\))?\\s+/;\nconst IMG = /!\\[[^\\]]*\\]\\(([^)]+)\\)/g;\nconst INLINE_SOL = /【\\s*(解|证|解答|论证)\\s*[】\\}\\]\\s]*/;\n\nlet total = 0, withImg = 0, imgCount = 0;\nfor (const d of dirs) {\n  const lines = fs.readFileSync(path.join(base, d, 'full.md'), 'utf8').split('\\n');\n  let cur = null, last = null;\n  const flush = () => { if (cur) { total++; if (cur.imgs.length) { withImg++; imgCount += cur.imgs.length; } } };\n  for (const l of lines) {\n    let id = null, isTwo = false;\n    let w = l;\n    const lc = l.match(LEAD_CAP);\n    if (lc) w = l.slice(lc[0].length);\n    const m3 = w.match(THREE_RE), m2 = w.match(TWO_RE);\n    if (m3) id = m3[0];\n    else if (m2) { id = m2[0]; isTwo = true; }\n    if (id) {\n      const ch = parseInt(id.split('.')[0], 10);\n      if ((isTwo && !TWO_LEVEL.has(ch)) || (!isTwo && TWO_LEVEL.has(ch))) id = null;\n    }\n    if (id) {\n      const rest = w.replace(id, '').trim();\n      if (cur && id === last && /^(所示|图\\s*\\d)/.test(rest)) { continue; }\n      flush();\n      cur = { id, text: rest, imgs: [], inSol: false };\n      last = id;\n      continue;\n    }\n    if (cur && !cur.inSol) {\n      if (SOL.test(l.trim()) || INLINE_SOL.test(l)) { cur.inSol = true; continue; }\n      cur.text += '\\n' + l;\n      for (const m of l.matchAll(IMG)) cur.imgs.push(m[1]);\n    }\n  }\n  flush();\n}\nconsole.log('题目总数:', total);\nconsole.log('题目区内含图片引用的题目数:', withImg);\nconsole.log('题目区内图片引用总数:', imgCount);\nEOF\nnode analyze2.js", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconst withImg=r.problems.filter(p=>p.images.length>0);\nconsole.log(\"含图片的题目数:\", withImg.length);\nconsole.log(\"图片总数:\", withImg.reduce((a,p)=>a+p.images.length,0));\n// 抽查：1.1.6 应只有题目提及的图\nconst p=r.problems.find(x=>x.id===\"1.1.6\");\nconsole.log(\"1.1.6 图片:\", p.images.map(i=>i.file.split(\"/\").pop()+(i.caption?\"[\"+i.caption+\"]\":\"\")).join(\", \"));\n'", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生_做题本 && for f in chapter_*_content.tex; do echo \"=== $f ===\"; head -6 \"$f\"; echo \"...\"; grep -n '\\\\section\\*' \"$f\" | head; echo; done", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生_做题本 && for f in chapter_*_content.tex; do echo \"=== $f ===\"; grep -c '^\\\\textbf{' \"$f\"; grep -n '\\\\section\\*' \"$f\"; grep -o '\\\\textbf{[0-9]*-[0-9]*}' \"$f\" | tail -1; echo; done", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生_做题本 && for f in chapter_*_content.tex; do echo \"=== $f ===\"; grep -cE '^\\\\textbf\\{[0-9]+-[0-9]+\\}' \"$f\"; grep -nE '\\\\section\\*' \"$f\"; echo \"最后一题: $(grep -oE '\\\\textbf\\{[0-9]+-[0-9]+\\}' \"$f\" | tail -1)\"; echo; done", "Bash=cd /d/Work/Problem-Solving-Book && git status --short && echo \"---branch---\" && git branch --show-current && echo \"---xelatex---\" && (command -v xelatex || ls \"/c/Program Files/texlive/2026/bin/windows/xelatex.exe\" 2>/dev/null || echo \"no xelatex\")", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生_做题本 && for f in chapter_*_content.tex; do echo \"=== $f ===\"; grep -nE '\\\\section\\*' \"$f\"; done", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生_做题本 && node -e \"\nconst fs=require('fs');\nfor (const f of ['chapter_1_content.tex','chapter_2_content.tex','chapter_3_content.tex','chapter_8_content.tex']) {\n  const b=fs.readFileSync(f);\n  const line3=b.toString('utf8').split(/\\r?\\n/)[2];\n  console.log(f, 'bytes3rd:', JSON.stringify(b.slice(0,80).toString('utf8')));\n  console.log('  line3:', JSON.stringify(line3));\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book && cat .gitignore && echo \"---\" && cat > /tmp/reflow.js <<'EOF'\nconst fs = require('fs');\nconst path = require('path');\nconst dir = process.argv[2];\nconst files = fs.readdirSync(dir).filter(f => /^chapter_\\d+_content\\.tex$/.test(f)).sort();\nconst problemRe = /^\\s*\\\\textbf\\{\\d+-\\d+\\}/;\nconst vfillRe = /^\\s*\\\\vfill\\s*$/;\nconst newpageRe = /^\\s*\\\\newpage\\s*$/;\nlet total = 0;\nfor (const f of files) {\n  const full = path.join(dir, f);\n  let text = fs.readFileSync(full, 'utf8');\n  const lines = text.split(/\\r?\\n/);\n  const probIdx = [];\n  lines.forEach((l, i) => { if (problemRe.test(l)) probIdx.push(i); });\n  if (probIdx.length === 0) { console.log(f, 'WARN: no problems'); continue; }\n  const header = lines.slice(0, probIdx[0]).join('\\n');\n  const blocks = [];\n  for (let k = 0; k < probIdx.length; k++) {\n    const end = k + 1 < probIdx.length ? probIdx[k + 1] : lines.length;\n    let block = lines.slice(probIdx[k], end);\n    block = block.filter(l => !vfillRe.test(l) && !newpageRe.test(l));\n    const out = [];\n    for (const l of block) {\n      if (l.trim() === '') { if (out.length && out[out.length - 1] !== '') out.push(''); }\n      else out.push(l);\n    }\n    while (out.length && out[out.length - 1] === '') out.pop();\n    blocks.push(out.join('\\n'));\n  }\n  const result = header.replace(/\\s+$/, '') + '\\n\\n' + blocks.join('\\n\\n\\\\newpage\\n\\n') + '\\n';\n  fs.writeFileSync(full, result, 'utf8');\n  total += probIdx.length;\n  console.log(f, '->', probIdx.length, 'problems, one per page');\n}\nconsole.log('TOTAL', total);\nEOF\necho \"script ready\"", "Bash=cd /d/Work/Problem-Solving-Book && node -e \"\nconst fs=require('fs');\nconst text=fs.readFileSync('舒幼生力学做题本/chapter_1_content.tex','utf8');\nconst lines=text.split(/\\r?\\n/);\nconsole.log('L0:', JSON.stringify(lines[0]));\nconsole.log('L4:', JSON.stringify(lines[4]));\nconst re=/^\\\\s*\\\\\\\\textbf\\{\\\\d+-\\\\d+\\}/;\nconsole.log('re source:', re.source);\nconsole.log('test L4:', re.test(lines[4]));\nconst re2=/^\\\\s*\\\\textbf\\{\\\\d+-\\\\d+\\}/;\nconsole.log('re2 source:', re2.source);\nconsole.log('test L4:', re2.test(lines[4]));\n\"", "Bash=grep -n \"problemRe\" /tmp/reflow.js | head -2 && node -e \"\nconst problemRe = /^\\\\s*\\\\\\\\textbf\\{\\\\d+-\\\\d+\\}/;\nconsole.log('source:', problemRe.source);\nconsole.log('test:', problemRe.test('\\\\\\\\textbf{1-1} abc'));\nconst re2 = /^\\\\s*\\\\textbf\\{\\\\d+-\\\\d+\\}/;\nconsole.log('src2:', re2.source);\n\"", "Bash=cd /d/Work/Problem-Solving-Book && node -e \"\nconst fs=require('fs');\nconst lines=fs.readFileSync('舒幼生力学做题本/chapter_1_content.tex','utf8').split(/\\r?\\n/);\nfor (let i=160;i<=170;i++) console.log((i+1)+': '+JSON.stringify(lines[i]));\n\"", "Bash=cd /d/Work/Problem-Solving-Book && node -e \"\nconst fs=require('fs');\nconst lines=fs.readFileSync('舒幼生力学做题本/chapter_1_content.tex','utf8').split(/\\r?\\n/);\nfor (let i=155;i<=172;i++) console.log((i+1)+': '+JSON.stringify(lines[i]));\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && echo \"includegraphics 引用数: $(grep -o 'includegraphics' chapter_*.tex | wc -l)\"; echo \"figures 文件数: $(ls figures/*.jpg | wc -l)\"; echo \"被引用但缺失:\"; grep -ho 'figures/[^}]*' chapt