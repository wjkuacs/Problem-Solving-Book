cludes(ch)) continue;\n      if(m2 && ![3,7,9,10,11].includes(ch)) continue;\n      // 续行：与上一题号相同且后续为\"所示\"等\n      const rest=l.replace(prob,\"\").trim();\n      if(prob===lastProb && /^(所示|图\\d)/.test(rest)) continue;\n      if(!perChapter[ch]) perChapter[ch]={count:0,ids:[],two:!!m2};\n      perChapter[ch].count++;\n      perChapter[ch].ids.push(prob);\n      lastProb=prob;\n    }\n  }\n}\nlet total=0;\nfor(let ch=1;ch<=12;ch++){\n  const pc=perChapter[ch];\n  if(pc){ total+=pc.count;\n    const ids=[...new Set(pc.ids)];\n    console.log(\"第\"+ch+\"章: \"+pc.count+\"题 (\"+(pc.two?\"两级\":\"三级\")+\") | \"+ids[0]+\" ~ \"+ids[ids.length-1]);\n  } else console.log(\"第\"+ch+\"章: 缺失\");\n}\nconsole.log(\"合计:\",total);\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; node -e '\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst twoRe=/^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst threeRe=/^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst chapNum={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12};\nconst perChapter={};\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  let curChapter=null, lastProb=null;\n  for(const l of lines){\n    const ct=l.match(/^## 第([一二三四五六七八九十]+)章/);\n    if(ct) curChapter=chapNum[ct[1]];\n    const m3=l.match(threeRe), m2=l.match(twoRe);\n    let prob=null;\n    if(m3) prob=m3[0]; else if(m2) prob=m2[0];\n    if(prob){\n      const ch=parseInt(prob.split(\".\")[0],10);\n      if(m3 && [3,7,9,10,11].includes(ch)) continue;\n      if(m2 && ![3,7,9,10,11].includes(ch)) continue;\n      const rest=l.replace(prob,\"\").trim();\n      if(prob===lastProb && /^(所示|图\\d)/.test(rest)) continue;\n      if(!perChapter[ch]) perChapter[ch]={ids:new Set(),two:!!m2};\n      perChapter[ch].ids.add(prob);\n      lastProb=prob;\n    }\n  }\n}\nfor(let ch=1;ch<=12;ch++){\n  const pc=perChapter[ch]; if(!pc){console.log(\"第\"+ch+\"章缺失\");continue;}\n  const ids=[...pc.ids].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));\n  const missing=[];\n  if(pc.two){\n    const [fn,ln]=[parseInt(ids[0].split(\".\")[1]),parseInt(ids[ids.length-1].split(\".\")[1])];\n    for(let i=fn;i<=ln;i++) if(!pc.ids.has(ch+\".\"+i)) missing.push(ch+\".\"+i);\n  } else {\n    const secs={};\n    for(const id of ids){const [c,s,n]=id.split(\".\").map(Number); if(!secs[s])secs[s]=new Set(); secs[s].add(n);}\n    for(const [s,ns] of Object.entries(secs)){\n      const arr=[...ns].sort((a,b)=>a-b);\n      for(let i=arr[0];i<=arr[arr.length-1];i++) if(!ns.has(i)) missing.push(ch+\".\"+s+\".\"+i);\n    }\n  }\n  console.log(\"第\"+ch+\"章: \"+ids.length+\"题 | \"+ids[0]+\"~\"+ids[ids.length-1]+\" | 缺号: \"+(missing.join(\",\")||\"无\"));\n}\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md1=\"$base/电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429/full.md\"; md8=\"$base/电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59/full.md\"; echo \"=== 1.1.13 任意位置 ===\"; grep -n '1\\.1\\.13' \"$md1\" | head -3; echo \"=== 1.2.13 任意位置 ===\"; grep -n '1\\.2\\.13' \"$md1\" | head -3; echo \"=== 8.3.11 任意位置（34c3 + 8b77）===\"; grep -n '8\\.3\\.11' \"$md8\" | head -3; grep -n '8\\.3\\.11' \"$base/电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459/full.md\" | head -3; echo \"=== 1.1.12 与 1.1.14 之间 ===\"; n12=$(grep -n '^1\\.1\\.12 ' \"$md1\"|head -1|cut -d: -f1); n14=$(grep -n '^1\\.1\\.14 ' \"$md1\"|head -1|cut -d: -f1); sed -n \"${n12},$((n14+1))p\" \"$md1\" | grep -vE '^\\$\\$|^\\$\\$' | head -12", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md1=\"$base/电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429/full.md\"; echo \"=== 1.1.13 题号行形态（行 355-390）===\"; sed -n '355,390p' \"$md1\" | grep -nE '1\\.1\\.1[234]|^【|^$$' | head; echo; n13=$(grep -n '图1\\.1\\.13' \"$md1\" | head -1 | cut -d: -f1); echo \"图1.1.13 在 $n13\"; sed -n \"$((n13-8)),$((n13+1))p\" \"$md1\"; echo; echo \"=== 8.3.11 附近完整（34c3 行 9645-9665）===\"; md8=\"$base/电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59/full.md\"; sed -n '9640,9668p' \"$md8\"", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; node -e '\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst twoRe=/^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst threeRe=/^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst chapNum={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12};\nlet stats={probWithFigRef:0, probTotal:0, imgRefs:0, captions:0, probWithCaptionInProb:0, probWithCaptionAnywhere:0};\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  let curProb=null, lastProb=null, inProb=false, probText=\"\", captionsInProb=[], imgsInProb=[];\n  for(const l of lines){\n    const ct=l.match(/^## 第([一二三四五六七八九十]+)章/);\n    const m3=l.match(threeRe), m2=l.match(twoRe);\n    let prob=null;\n    if(m3) prob=m3[0]; else if(m2) prob=m2[0];\n    if(prob){\n      const ch=parseInt(prob.split(\".\")[0],10);\n      if(m3 && [3,7,9,10,11].includes(ch)) continue;\n      if(m2 && ![3,7,9,10,11].includes(ch)) continue;\n      const rest=l.replace(prob,\"\").trim();\n      if(prob===lastProb && /^(所示|图\\d)/.test(rest)){ // 续行：并入当前题目文字\n        if(curProb){ probText+=\" \"+rest; }\n        continue;\n      }\n      // 新题开始\n      if(curProb){ stats.probTotal++; \n        if(/图 ?\\d+\\.\\d+(\\.\\d+)?/.test(probText)) stats.probWithFigRef++;\n      }\n      curProb=prob; lastProb=prob; probText=l.replace(prob,\"\").trim(); inProb=true; captionsInProb=[]; imgsInProb=[];\n      continue;\n    }\n    if(curProb){\n      // 题目区内：解题标记前\n      if(/^【(解|证|解答|论证|解\\s*)】/.test(l)){ \n        inProb=false;\n        if(captionsInProb.length>0) stats.probWithCaptionInProb++;\n      }\n      if(inProb){\n        probText+=\" \"+l;\n        const caps=(l.match(/图 ?\\d+\\.\\d+(\\.\\d+)?(\\([0-9]+\\))?/g)||[]);\n        captionsInProb.push(...caps);\n        const imgs=(l.match(/!\\[[^\\]]*\\]\\(images\\/[^)]+\\)/g)||[]);\n        imgsInProb.push(...imgs);\n      }\n    }\n  }\n  if(curProb){ stats.probTotal++; if(/图 ?\\d+\\.\\d+(\\.\\d+)?/.test(probText)) stats.probWithFigRef++; }\n}\nconsole.log(\"总题目:\",stats.probTotal);\nconsole.log(\"题目文字含图引用:\",stats.probWithFigRef);\nconsole.log(\"题目区内出现图注的题目:\",stats.probWithCaptionInProb);\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\n// 抽查 8.3.11、12.1.1、1.1.10、6.2.22、3.1\nfor(const id of [\"8.3.11\",\"12.1.1\",\"1.1.10\",\"6.2.22\",\"3.1\",\"11.70\"]){\n  const p=r.problems.find(x=>x.id===id);\n  if(!p){console.log(\"!! 未找到\",id);continue;}\n  console.log(\"=== \"+id+\" (图片:\"+p.images.length+\") ===\");\n  console.log(p.text.replace(/\\n/g,\" \").slice(0,150));\n  if(p.images.length) console.log(\"  图片:\",p.images.map(i=>i.file.split(\"/\").pop()+(i.caption?\" [\"+i.caption+\"]\":\"\")).join(\"; \"));\n  console.log();\n}\n// 检查是否有题目文本包含【解】\nconst withSol=r.problems.filter(p=>/【解】|【证】/.test(p.text));\nconsole.log(\"题目文本含【解】/【证】的数量(应为0):\",withSol.length);\n// 检查空题目\nconst empty=r.problems.filter(p=>p.text.trim().length<5);\nconsole.log(\"空/极短题目:\",empty.map(p=>p.id).join(\",\")||\"无\");\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; node -e '\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst re=/^图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\(\\d+\\))?\\s+(?:图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\(\\d+\\))?\\s+)?(\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?)\\s/;\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  let n=0;\n  for(let i=0;i<lines.length;i++){\n    const m=lines[i].match(re);\n    if(m){ n++; console.log(d.slice(0,6),\"行\"+i+\":\",lines[i].slice(0,80)); }\n  }\n  console.log(\"--- \"+d.slice(0,6)+\" 共\"+n+\"处\");\n}\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md=\"$base/电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59/full.md\"; echo \"=== 图片行后紧跟图注的布局样例 ===\"; node -e '\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst IMG=/!\\[[^\\]]*\\]\\(([^)]+)\\)/;\nconst CAP=/图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\(\\d+\\))?/;\nlet layout={imgLineOnly:0,imgNextCap:0,imgSameLineCap:0,imgGap1:0,imgNoCap:0};\nconst samples=[];\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  for(let i=0;i<lines.length;i++){\n    if(IMG.test(lines[i])){\n      const cur=lines[i].trim();\n      if(CAP.test(cur.replace(IMG,\"\"))) layout.imgSameLineCap++;\n      else {\n        const n1=(lines[i+1]||\"\").trim(), n2=(lines[i+2]||\"\").trim();\n        if(CAP.test(n1)) layout.imgNextCap++;\n        else if(CAP.test(n2)) layout.imgGap1++;\n        else { layout.imgNoCap++; if(samples.length<3) samples.push(d.slice(0,6)+\" L\"+(i+1)+\": \"+cur.slice(0,60)+\" || nxt: \"+n1.slice(0,40)); }\n      }\n    }\n  }\n}\nconsole.log(\"布局统计:\",JSON.stringify(layout));\nconsole.log(\"无图注样例:\",samples);\n'", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nfor(const id of [\"8.3.11\",\"12.1.1\",\"1.1.10\",\"6.2.22\",\"3.1\",\"11.70\",\"8.3.10\"]){\n  const p=r.problems.find(x=>x.id===id);\n  if(!p){console.log(\"!! 未找到\",id);continue;}\n  console.log(\"=== \"+id+\" (图片:\"+p.images.length+\") ===\");\n  console.log(p.text.replace(/\\n/g,\" \").slice(0,140));\n  if(p.images.length) console.log(\"  图片:\",p.images.map(i=>i.file.split(\"/\").pop()+(i.caption?\" [\"+i.caption+\"]\":\"\")).join(\"; \"));\n  console.log();\n}\nconst withSol=r.problems.filter(p=>/【解】|【证】|【解答】/.test(p.text));\nconsole.log(\"题目文本含解答标记(应为0):\",withSol.length);\nconst empty=r.problems.filter(p=>p.text.trim().length<5);\nconsole.log(\"空/极短题目:\",empty.map(p=>p.id).join(\",\")||\"无\");\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nconst ch8=r.problems.filter(p=>p.chapter===8).map(p=>p.id);\nconsole.log(\"第8章题数:\",ch8.length);\nconsole.log(\"8.3 段:\",ch8.filter(id=>id.startsWith(\"8.3.\")).join(\",\"));\nconsole.log(\"含 8.3.1x:\",ch8.filter(id=>/^8\\.3\\.1\\d/.test(id)).join(\",\"));\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nconsole.log(\"总题数:\",r.total);\n// 1. 题目文本含解答标记(应为0)\nconst withSol=r.problems.filter(p=>/【解】|【证】|【解答】|【论证】|【讨论】/.test(\"x\")); // 报告无 text，跳过\nconsole.log(\"(报告不含 text 字段，仅 textLength)\");\n// 2. 空题目\nconst empty=r.problems.filter(p=>p.textLength<5);\nconsole.log(\"空题目:\",empty.map(p=>p.id).join(\",\")||\"无\");\n// 3. 图片异常：单题图片>8张\nconst many=r.problems.filter(p=>p.images.length>8).map(p=>p.id+\"(\"+p.images.length+\")\");\nconsole.log(\"图片>8张的题:\",many.join(\",\")||\"无\");\n// 4. 图注与题号不匹配的图片（归属校验）\nlet mismatched=[];\nfor(const p of r.problems){\n  for(const img of p.images){\n    if(img.caption){\n      const m=img.caption.match(/图\\s*(\\d{1,2})\\.(\\d{1,2})(?:\\.(\\d{1,2}))?/);\n      if(m){\n        let t=m[1]+\".\"+m[2]; if(m[3]) t+=\".\"+m[3];\n        if(t!==p.id) mismatched.push(p.id+\" <- \"+img.caption);\n      }\n    }\n  }\n}\nconsole.log(\"图注与题号不匹配数