片总数:\",allImgs.length,\"| srcPath 缺失:\",allImgs.filter(i=>!i.srcPath).length);\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\n// 检查题目文本是否含解答标记（当前报告无 text 字段，重新从源验证）\n// 验证题目区内是否混入解答文本：抽查 textLength 异常的题\nconst odd=r.problems.filter(p=>p.textLength>2000).map(p=>p.id+\"(\"+p.textLength+\")\");\nconsole.log(\"textLength>2000 的题:\",odd.join(\",\")||\"无\");\n// 图注文字是否应保留在题目文本中？当前 text 含图注行（如\"图12.1.1(1)\"），生成时需处理\n// 查看 12.1.1 的 text 是否含图注文字\nconst p12=r.problems.find(p=>p.id===\"12.1.1\");\nconsole.log(\"12.1.1 图注文字:\",p12.images.map(i=>i.caption).join(\",\"));\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; for d in \"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\" \"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\" \"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\" \"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"; do echo \"-- $d\"; grep -oE '^#{0,3}\\s*【[^】]{1,4}】' \"$base/$d/full.md\" | sort | uniq -c | sort -rn | head -12; done", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; for d in \"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\" \"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\" \"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\" \"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"; do echo \"-- $d\"; grep -oE '^\\s*#{0,3}\\s*【[^】]{1,6}】' \"$base/$d/full.md\" | sort | uniq -c | sort -rn | head -14; done", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconsole.log(\"总题数:\",r.total);\nconst odd=r.problems.filter(p=>p.textLength>2000).map(p=>p.id+\"(\"+p.textLength+\")\");\nconsole.log(\"textLength>2000 的题:\",odd.join(\",\")||\"无\");\n// 7.2 应大幅缩短\nconst p72=r.problems.find(p=>p.id===\"7.2\");\nconsole.log(\"7.2 textLength:\",p72?p72.textLength:\"未找到\");\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md=\"$base/电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b/full.md\"; echo \"=== 5.1.25 原文区域 ===\"; n=$(grep -n '^5\\.1\\.25 ' \"$md\" | head -1 | cut -d: -f1); echo \"行号:$n\"; sed -n \"${n},$((n+12))p\" \"$md\" | head -14; echo \"...\"; echo \"=== 下一题号位置 ===\"; grep -n '^5\\.1\\.2[56] ' \"$md\" | head -3", "Bash=cd \"电磁学千题解做题本\" && node -e '\n// 从源文件重新检测：题号行后、下一题号前，若含 \\tag{ 或【讨论】等解答特征则标记\nconst fs=require(\"fs\");\nconst base=\"D:/Program Files/Mineru/新建文件夹\";\nconst dirs=[\"电磁学千题解（1）.pdf-8b77de4e-a2ef-45cd-9aaa-a89e3a4e0459\",\"电磁学千题解（1）.pdf-34c3b57d-3ed1-453e-b5f5-4435540e1e59\",\"电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b\",\"电磁学千题解（1）.pdf-f2296093-bd2f-436c-a058-d4ca666dd429\"];\nconst SOL=/^\\s*#{0,3}\\s*【(解|证|解答|论证|解\\s*)】/;\nconst THREE=/^(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst TWO=/^(\\d{1,2})\\.(\\d{1,2})(?=\\s|$)/;\nconst TWOCH=new Set([3,7,9,10,11]);\nconst LEAD=/^图\\s*\\d{1,2}\\.\\d{1,2}(?:\\.\\d{1,2})?(?:\\(\\d+\\))?\\s+/;\nlet flagged=[];\nfor(const d of dirs){\n  const lines=fs.readFileSync(base+\"/\"+d+\"/full.md\",\"utf8\").split(\"\\n\");\n  let cur=null,last=null,block=\"\";\n  for(const l of lines){\n    let id=null,isTwo=false;\n    const lc=l.match(LEAD); let w=l; if(lc) w=l.slice(lc[0].length);\n    const m3=w.match(THREE), m2=w.match(TWO);\n    if(m3)id=m3[0]; else if(m2){id=m2[0];isTwo=true;}\n    if(id){\n      const ch=parseInt(id.split(\".\")[0],10);\n      if((isTwo&&!TWOCH.has(ch))||(!isTwo&&TWOCH.has(ch))) id=null;\n    }\n    if(id){\n      const rest=w.replace(id,\"\").trim();\n      if(cur&&id===last&&/^(所示|图\\s*\\d)/.test(rest)){continue;}\n      if(cur){ \n        // 检查上一题 block 是否缺解标记但含解答特征\n        if(!/【(解|证|解答|论证)】/.test(block) && /\\\\tag\\{/.test(block)) flagged.push(cur+\"(缺解标记,含tag)\");\n        else if(/【讨论】|【别解】/.test(block) && !/【(解|证|解答|论证)】/.test(block)) flagged.push(cur+\"(含讨论/别解)\");\n      }\n      cur=id;last=id;block=rest;continue;\n    }\n    if(cur) block+=\"\\n\"+l;\n  }\n}\nconsole.log(\"疑似混入解答的题目数:\",flagged.length);\nflagged.forEach(f=>console.log(\"  \",f));\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md=\"$base/电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b/full.md\"; n=$(grep -n '^5\\.1\\.25 ' \"$md\" | head -1 | cut -d: -f1); echo \"起:$n 止:9999\"; sed -n \"${n},9999p\" \"$md\" | grep -nE '【|^5\\.1\\.2[56] |^图|\\\\tag' | head -10", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconsole.log(\"总题数:\",r.total);\nconst p525=r.problems.find(p=>p.id===\"5.1.25\");\nconsole.log(\"5.1.25 textLength:\",p525.textLength);\nconsole.log(\"5.1.25 文本尾部:\",p525.text.split(\"\\n\").slice(-2).join(\" | \").slice(0,120));\nconsole.log(\"5.1.25 图片:\",p525.images.map(i=>i.file.split(\"/\").pop()+(i.caption?\"[\"+i.caption+\"]\":\"\")).join(\", \"));\nconst p72=r.problems.find(p=>p.id===\"7.2\");\nconsole.log(\"7.2 textLength:\",p72.textLength);\nconst odd=r.problems.filter(p=>p.textLength>2500).map(p=>p.id+\"(\"+p.textLength+\")\");\nconsole.log(\"textLength>2500 的题:\",odd.join(\",\")||\"无\");\n'", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconsole.log(\"总题数:\",r.total,\"| 异常:\",r.anomalies.map(a=>a.type+(a.id||\"\")).join(\", \"));\nconst p525=r.problems.find(p=>p.id===\"5.1.25\");\nconsole.log(\"5.1.25 文本:\",p525.text.replace(/\\n/g,\" ⏎ \").slice(0,250));\nconsole.log(\"5.1.25 图片:\",p525.images.map(i=>i.file.split(\"/\").pop()+(i.caption?\"[\"+i.caption+\"]\":\"\")).join(\", \"));\nconst p813=r.problems.find(p=>p.id===\"8.3.11\");\nconsole.log(\"8.3.11 文本:\",(p813.text.replace(/\\n/g,\" \")).slice(0,120));\nconsole.log(\"8.3.11 图片:\",p813.images.length);\nconst odd=r.problems.filter(p=>p.textLength>2500).map(p=>p.id+\"(\"+p.textLength+\")\");\nconsole.log(\"textLength>2500:\",odd.join(\",\")||\"无\");\n// 题目文本含解答标记检查\nconst withMark=r.problems.filter(p=>/【(解|证|解答|论证)】/.test(p.text));\nconsole.log(\"含解答标记的题目文本:\",withMark.map(p=>p.id).join(\",\")||\"无\");\n// 空文本\nconst empty=r.problems.filter(p=>p.text.trim().length<3);\nconsole.log(\"空文本:\",empty.map(p=>p.id).join(\",\")||\"无\");\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nfor(const id of [\"2.3.68\",\"4.2.14\",\"8.1.25\",\"9.18\"]){\n  const p=r.problems.find(x=>x.id===id);\n  console.log(\"=== \"+id+\" ===\");\n  const lines=p.text.split(\"\\n\");\n  const idx=lines.findIndex(l=>/【(解|证|解答|论证)】/.test(l));\n  console.log(\"含标记行:\",JSON.stringify(lines[idx]||\"\"));\n  console.log(\"标记前行数:\",idx,\"总行数:\",lines.length);\n  console.log(\"前2行:\",lines.slice(Math.max(0,idx-2),idx).map(l=>l.slice(0,60)).join(\" | \"));\n  console.log();\n}\n'", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconsole.log(\"总题数:\",r.total);\nconst withMark=r.problems.filter(p=>/【(解|证|解答|论证)】/.test(p.text));\nconsole.log(\"含解答标记的题目文本:\",withMark.map(p=>p.id).join(\",\")||\"无\");\nconst empty=r.problems.filter(p=>p.text.trim().length<3);\nconsole.log(\"空文本:\",empty.map(p=>p.id).join(\",\")||\"无\");\nconst odd=r.problems.filter(p=>p.textLength>2500).map(p=>p.id+\"(\"+p.textLength+\")\");\nconsole.log(\"textLength>2500:\",odd.join(\",\")||\"无\");\n// 检查 2.3.68 是否正确截断\nconst p=r.problems.find(x=>x.id===\"2.3.68\");\nconsole.log(\"2.3.68 尾部:\",p.text.split(\"\\n\").slice(-2).join(\" | \").slice(0,150));\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\nconst p=r.problems.find(x=>x.id===\"2.3.68\");\nconsole.log(\"=== 2.3.68 完整文本 ===\");\nconsole.log(JSON.stringify(p.text));\n'", "Bash=cd \"电磁学千题解做题本\" && node extract.js && node -e '\nconst r=require(\"./extract_report.json\");\nconst p=r.problems.find(x=>x.id===\"2.3.68\");\nconsole.log(\"2.3.68 完整:\",JSON.stringify(p.text));\nconst withMark=r.problems.filter(p=>/【(解|证|解答|论证)】/.test(p.text));\nconsole.log(\"含解答标记:\",withMark.map(p=>p.id).join(\",\")||\"无\");\nconst odd=r.problems.filter(p=>p.textLength>2500).map(p=>p.id+\"(\"+p.textLength+\")\");\nconsole.log(\"textLength>2500:\",odd.join(\",\")||\"无\");\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\n// 抽查若干题的文本开头（应无\"【解】\"等解答内容、无图片残留引用）\nconst samples=[\"1.1.1\",\"12.2.17\",\"11.72\",\"3.47\",\"7.48\",\"9.29\",\"10.39\",\"4.3.14\",\"5.2.26\",\"6.2.44\",\"8.4.7\",\"2.3.72\"];\nfor(const id of samples){\n  const p=r.problems.find(x=>x.id===id);\n  if(!p){console.log(\"!! 缺\",id);continue;}\n  const first=p.text.split(\"\\n\")[0].slice(0,60);\n  const last=p.text.split(\"\\n\").filter(Boolean).slice(-1)[0]?.slice(0,50)||\"(空)\";\n  console.log(id, \"| 首:\",first, \"| 尾:\",last, \"| 图:\",p.images.length);\n}\n// 统计：题目文本中含 ![]( 的残留（应尽量少——图片引用应被 images 字段收集而非留在文本）\nconst withImgRef=r.problems.filter(p=>/!\\[/.test(p.text));\nconsole.log(\"文本含图片引用残留:\",withImgRef.length);\n// 文本含 \\tag 的（解答公式编号，题目中不应有）\nconst withTag=r.problems.filter(p=>/\\\\tag\\{/.test(p.text));\nconsole.log(\"文本含\\\\tag(可能残留解答):\",withTag.map(p=>p.id).join(\",\")||\"无\");\n'", "Bash=cd \"电磁学千题解做题本\" && node -e '\nconst r=require(\"./extract_report.json\");\n// 1. 图片引用残留形态\nconst p1=r.problems.find(p=>/!\\[/.test(p.text));\nconsole.log(\"残留样例:\",JSON.stringify(p1.text.slice(0,300)));\n// 2. 2.3.72 尾部\nconst p2=r.problems.find(p=>p.id===\"2.3.72\");\nconsole.log(\"2.3.72 尾部:\",JSON.stringify(p2.text.slice(-200)));\nconsole.log(\"2.3.72 图片:\",p2.images.map(i=>i.file.split(\"/\").pop()+(i.caption?\"[\"+i.caption+\"]\":\"\")).join(\", \"));\n// 3. 残留 $$ 未闭合的题目\nconst unclosed=r.problems.filter(p=>{const n=(p.text.match(/\\$\\$/g)||[]).length;return n%2===1;}).map(p=>p.id+\"(\"+(p.text.match(/\\$\\$/g)||[]).length+\"$$)\");\nconsole.log(\"$$ 未配对题目:\",unclosed.join(\",\")||\"无\");\n'", "Bash=base=\"D:/Program Files/Mineru/新建文件夹\"; md=\"$base/电磁学千题解（1）.pdf-de0f6413-8ce8-47a4-be64-bcd5558bab9b/full.md\"; echo \"=== 2.3.72 题号行与后续 ===\"; n=$(grep -n '^2\\.3\\.72 ' \"$md\" | head -1 | cut -d: -f1); echo \"行号:$n\"; sed -n \"${n},$((n+15))p\" \"$md\" | cat -n | head -16; echo; echo \"=== 4.3.9 ===\"; n2=$(grep -n '^4\\.3\\.9 ' \"$md\" | head -1 | c