 const basename=path.basename(r.file).replace('.jpg','').replace('.png','');\n    // check if tikzfig already applied (has tabular wrapper in source)\n    const ctx=text.substring(Math.max(0,r.pos-150),r.pos+50);\n    if (ctx.includes('tabular') || ctx.includes('tikzfigs/')) { already++; done.push(path.basename(r.file)); continue; }\n    // look up the nearest \\textbf line above\n    const before=text.substring(0,r.pos);\n    const probMatch=[...before.matchAll(/\\\\textbf\\{(\\d+-\\d+)\\}/g)];\n    const probNum=probMatch.length?probMatch[probMatch.length-1][1]:'?';\n    // find the tikz filename convention\n    const tikzName='fig'+basename.replace('图','')+'.tex';\n    const tikzExists=tikzfs.has(tikzName);\n    todo.push({prob:probNum, img:path.basename(r.file), tikzName, tikzExists});\n    total++;\n  }\n  if(todo.length||done.length) console.log(ch+': total='+refs.length+' already='+done.length+' todo='+todo.length);\n  for (const t of todo) console.log('  '+t.prob+' '+t.img+' tikz='+t.tikzName+' exists='+t.tikzExists);\n}\nconsole.log('\\\\nGRAND TOTAL: remaining='+total+' already_done='+already);\n\" 2>&1 | head -200", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs'),path=require('path');\nconst chaps=['chapter_1_content','chapter_2_content','chapter_3_content','chapter_4_content','chapter_5_content','chapter_6_content','chapter_7_content','chapter_8_content'];\nconst results=[];\nfor (const ch of chaps) {\n  const text=fs.readFileSync(ch+'.tex','utf8');\n  const lines=text.split(/\\r?\\n/);\n  // find all image refs\n  for (let i=0;i<lines.length;i++){\n    if (!lines[i].includes('includegraphics')) continue;\n    const m=lines[i].match(/figures\\/([^}]+)/);\n    if (!m) continue;\n    const img=m[1];\n    const basename=path.basename(img,'.jpg').replace('.png','');\n    const tikzName='fig'+basename.replace('图','')+'.tex';\n    // find nearest \\\\textbf above\n    let probNum='?';\n    for (let j=i;j>=0;j--){\n      const pm=lines[j].match(/\\\\\\\\textbf\\{(\\d+-\\d+)\\}/);\n      if(pm){probNum=pm[1];break;}\n    }\n    // get surrounding text (problem text, 20 lines before + image block)\n    const start=Math.max(0,i-20);\n    const end=Math.min(lines.length,i+6);\n    const ctx=lines.slice(start,end).join('\\n');\n    // check if already has tabular\n    const before=lines.slice(Math.max(0,i-3),i).join(' ');\n    if (before.includes('tabular')) continue;\n    results.push({ch,prob:probNum,img,tikzName,ctx:ctx.substring(0,800)});\n  }\n}\n// write to json for use in batch\nfs.writeFileSync('_image_contexts.json',JSON.stringify(results,null,2),'utf8');\nconsole.log('Total remaining images:',results.length);\n// group by chapter\nconst groups={};\nfor (const r of results) { groups[r.ch]=groups[r.ch]||[]; groups[r.ch].push(r); }\nfor (const [k,v] of Object.entries(groups)) console.log(k+': '+v.length+' images');\n\" 2>&1", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst d=JSON.parse(require('fs').readFileSync('_image_contexts.json','utf8'));\nconst ch1=d.filter(r=>r.ch==='chapter_1_content');\nfor (const r of ch1) { console.log('=== '+r.prob+' | '+r.img+' ==='); console.log(r.ctx); console.log(); }\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst d=JSON.parse(require('fs').readFileSync('_image_contexts.json','utf8'));\n// chapter 2\nconst ch2=d.filter(r=>r.ch==='chapter_2_content');\nconsole.log('=== CHAPTER 2 ===');\nfor (const r of ch2) console.log(r.prob+' | '+r.img+' | tikz='+r.tikzName);\nconsole.log();\n// chapter 6 (small)\nconst ch6=d.filter(r=>r.ch==='chapter_6_content');\nconsole.log('=== CHAPTER 6 ===');\nfor (const r of ch6) console.log(r.prob+' | '+r.img+' | tikz='+r.tikzName);\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs'),path=require('path');\nconst chaps=['chapter_2_content','chapter_3_content','chapter_4_content','chapter_5_content','chapter_6_content','chapter_7_content','chapter_8_content'];\nconst results=[];\nfor (const ch of chaps) {\n  const text=fs.readFileSync(ch+'.tex','utf8');\n  const lines=text.split(/\\r?\\n/);\n  // find all \\\\textbf{X-Y} lines for problem boundaries\n  const probLines=[];\n  for (let i=0;i<lines.length;i++){\n    const m=lines[i].match(/\\\\\\\\textbf\\{(\\d+-\\d+)\\}/);\n    if(m) probLines.push({num:m[1],line:i});\n  }\n  // find all includegraphics lines\n  for (let i=0;i<lines.length;i++){\n    if (!lines[i].includes('includegraphics') || !lines[i].includes('figures/')) continue;\n    // check already tabular\n    if (i>0 && lines.slice(Math.max(0,i-3),i).join('').includes('tabular')) continue;\n    const m=lines[i].match(/figures\\/([^}]+)/);\n    if(!m) continue;\n    const img=m[1];\n    const basename=path.basename(img,'.jpg').replace('.png','');\n    const tikzName='fig'+basename.replace('图','')+'.tex';\n    // find nearest \\\\textbf above\n    let probNum='?';\n    for (let j=probLines.length-1;j>=0;j--){\n      if(probLines[j].line<=i){probNum=probLines[j].num;break;}\n    }\n    // get problem text (from textbf line to image line)\n    const probLine=probLines.find(p=>p.num===probNum);\n    const startLine=probLine?probLine.line:i;\n    const ctx=lines.slice(startLine,Math.min(lines.length,i+4)).join('\\\\n').substring(0,1000);\n    results.push({ch,prob:probNum,img,tikzName,ctx});\n  }\n}\nfs.writeFileSync('_image_contexts_v2.json',JSON.stringify(results,null,2),'utf8');\nconsole.log('Total:',results.length);\nfor (const r of results) console.log(r.ch+' '+r.prob+' '+r.img+' -> '+r.tikzName);\n\" 2>&1 | head -80", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs'),path=require('path');\n// Read chapter 2 and extract problem texts around each image\nconst text=fs.readFileSync('chapter_2_content.tex','utf8');\nconst lines=text.split(/\\r?\\n/);\n\n// Build a map: for each line, the nearest \\\\textbf above\nlet curProb='?', curStart=0;\nconst probAt=[];\nfor(let i=0;i<lines.length;i++){\n  const m=lines[i].match(/\\\\\\\\textbf\\{(\\d+-\\d+)\\}/);\n  if(m){curProb=m[1];curStart=i;}\n  probAt.push({prob:curProb,start:curStart});\n}\n\n// Find all image lines\nfor(let i=0;i<lines.length;i++){\n  if(!lines[i].includes('includegraphics')||!lines[i].includes('figures/')) continue;\n  // already tabular?\n  if(i>0 && lines.slice(Math.max(0,i-3),i).join('').includes('tabular')) continue;\n  const m=lines[i].match(/figures\\/([^}]+)/);\n  if(!m) continue;\n  const p=probAt[i];\n  // Extract from problem header to 2 lines after image\n  const block=lines.slice(p.start, Math.min(lines.length,i+5)).join('\\n');\n  console.log('=== '+p.prob+' | '+m[1]+' ===');\n  console.log(block.substring(0,600));\n  console.log();\n}\n\" 2>&1 | head -300", "Bash=ls -d /d/Work/Problem-Solving-Book/舒幼生力学做题本/tikzfigs_ch* 2>/dev/null | head -10; echo \"---\"; for d in /d/Work/Problem-Solving-Book/舒幼生力学做题本/tikzfigs_ch*/; do echo \"$d: $(ls \"$d\"*.tex 2>/dev/null | wc -l) files\"; done", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs');\nconst chaps=fs.readdirSync('.').filter(f=>/^chapter_\\d+_content\\.tex$/.test(f)).sort();\nfor (const ch of chaps) {\n  let t=fs.readFileSync(ch,'utf8');\n  // fix: tikzfigs\\chapterN -> tikzfigs/chapterN\n  const fixed=t.replace(/tikzfigs\\\\\\\\chapter(\\d)/g,'tikzfigs/chapter\\$1');\n  if (fixed!==t) { fs.writeFileSync(ch,fixed,'utf8'); console.log(ch+' fixed'); }\n  else console.log(ch+' ok');\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs');\n// check what's actually in the file at the problematic line\nconst t=fs.readFileSync('chapter_2_content.tex','utf8');\nconst lines=t.split(/\\r?\\n/);\nfor (let i=0;i<lines.length;i++) {\n  if (lines[i].includes('tikzfigs')) { console.log((i+1)+': '+JSON.stringify(lines[i])); break; }\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs');\nconst chaps=fs.readdirSync('.').filter(f=>/^chapter_\\d+_content\\.tex$/.test(f)).sort();\nfor (const ch of chaps) {\n  let t=fs.readFileSync(ch,'utf8');\n  // The actual content has single backslash: tikzfigs\\chapterN\n  const fixed=t.replace(/tikzfigs\\\\chapter(\\d)/g,'tikzfigs/chapter\\$1');\n  if (fixed!==t) { fs.writeFileSync(ch,fixed,'utf8'); console.log(ch+' fixed'); }\n  else console.log(ch+' ok');\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs');\nconst t=fs.readFileSync('chapter_2_content.tex','utf8');\n// Find the actual byte sequence around 'tikzfigs'\nconst idx=t.indexOf('tikzfigs');\nconsole.log('chars around match:', JSON.stringify(t.substring(idx, idx+30)));\nconsole.log('char codes:', Array.from(t.substring(idx, idx+25)).map(c=>c.charCodeAt(0)));\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs'),path=require('path');\nfor (let i=1;i<=8;i++) {\n  const dir='tikzfigs/chapter'+i;\n  try {\n    for (const f of fs.readdirSync(dir)) {\n      if (!f.endsWith('.tex')) continue;\n      const t=fs.readFileSync(path.join(dir,f),'utf8');\n      if (t.includes('snake')) console.log(dir+'/'+f+': has snake');\n      if (t.includes('decoration')) console.log(dir+'/'+f+': has decoration keyword');\n    }\n  } catch(e) {}\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs'),path=require('path');\n// Find all problematic arc patterns across all tikz files\nfor (let i=1;i<=8;i++) {\n  const dir='tikzfigs/chapter'+i;\n  try { for (const f of fs.readdirSync(dir)) {\n    if (!f.endsWith('.tex')) continue;\n    const t=fs.readFileSync(path.join(dir,f),'utf8');\n    // check for colon-separated arc options\n    if (t.includes('angle:') || t.includes('radius:')) {\n      console.log(dir+'/'+f+': has colon syntax');\n    }\n    // check for data cs polar\n    if (t.includes('data cs')) console.log(dir+'/'+f+': has data cs');\n  }} catch(e) {}\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs'),path=require('path');\nfor (let i=1;i<=8;i++) {\n  const dir='tikzfigs/chapter'+i;\n  try { for (const f of fs.readdirSync(dir)) {\n    if (!f.endsWith('.tex')) continue;\n    const t=fs.readFileSync(path.join(dir,f),'utf8');\n    if (t.includes('\\\\\\\\def\\\\\\\\') && t.includes('{{')) console.log(dir+'/'+f+': has double-brace def');\n  }} catch(e) {}\n}\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && echo \"=== 各章TikZ图数量 ===\" && for i in 1 2 3 4 5 6 7 8; do n=$(ls tikzfigs/chapter$i/*.tex 2>/dev/null | wc -l); echo \"chapter$i: $n\"; done && echo \"---\" && total=$(find tikzfigs -name '*.tex' | wc -l); echo \"TikZ文件总数: $total\" && echo \"=== 各章并排图片数 ===\" && for i in 1 2 3 4 5 6 7 8; do n=$(grep -c \"tikzfigs/chapter$i\" chapter_${i}_content.tex 2>/dev/null || echo 0); echo \"chapter$i: $n\"; done && echo \"=== 各章缺失TikZ ===\" && for i in 1 2 3 4 5 6 7 8; do ch=$(grep -o \"figures/图[^}]*\" chapter_${i}_content.tex | sort -u | wc -l); done", "Bash=cd /d/Work/Problem-Solving-Book && git add -A && git status --short | head -20 && echo \"...共 $(git status --short | wc -l) 项\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs=require('fs');\nlet t=fs.readFileSync('main.tex','utf8');\n// Replace all \\input{chapter_X_content.tex} with \\input{chapters/chapter_X_content.tex}\nfor(let i=1;i<=8;i++){\n  t=t.split('chapter_'+i+'_content.tex').join('chapters/chapter_'+i+'_content.tex');\n}\nfs.writeFileSync('main.tex',t,'utf8');\nconsole.log('done');\n\" && rm -f _fix_main.js && grep \"input{chapter\" main.tex", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst fs = require('fs');\nconst buf = fs.readFileSync('figures/图2_1.jpg');\nconsole.log('size:', buf.length, 'bytes');\nconsole.log('magic:', buf[0].toString(16), buf[1].toString(16), buf[2].toString(16));\n// Check if there's any way to get dimensions\n// JPEG SOF marker\nfor (let i = 0; i < buf.length - 4; i++) {\n  if (buf[i] === 0xFF && buf[i+1] === 0xC0) {\n    const h = buf.readUInt16BE(i+5);\n    const w = buf.readUInt16BE(i+7);\n    console.log('dimensions:', w, 'x', h);\n    break;\n  }\n}\n\"", "Bash=node -e \"try { require('sharp'); console.log('sharp: available'); } catch(e) { console.log('sharp: not found'); }\" 2>/dev/null; node -e \"try { require('jimp'); console.log('jimp: available'); } catch(e) { console.log('jimp: not found'); }\" 2>/dev/null; node -e \"try { require('canvas'); console.log('canvas: available'); } catch(e) { console.log('canvas: not found'); }\" 2>/dev/null; echo \"---\"; npm ls --depth=0 2>/dev/null | head -10", "Bash=node -e \"\nconst http = require('http');\nconst req = http.request({hostname:'127.0.0.1',port:15721,path:'/v1/models',method:'GET',headers:{'Content-Type':'application/json'}}, res => {\n  let d='';\n  res.on('data', c => d+=c);\n  res.on('end', () => console.log('status:', res.statusCode, 'body:', d.substring(0,500)));\n});\nreq.on('error', e => console.log('error:', e.message));\nreq.end();\n\"", "Bash=cd /d/Work/Problem-Solving-Book/舒幼生力学做题本 && node -e \"\nconst { Jimp } = require('jimp');\nasync function analyze(path) {\n  const img = await Jimp.read(path);\n  console.log('file:', path);\n  console.log('size:', img.bitmap.width, 'x', img.bitmap.height);\n  console.log('bytes:', img.bitmap.data.length);\n  // Sample some pixel colors to understand the image\n  const w = img.bitmap.width, h = img.bitmap.height;\n  const data = img.bitmap.data;\n  // Count dark vs light pixels\n  let dark=0, light=0, total=0;\n  for (let y=0; y<h; y+=3) {\n    for (let x=0; x<w; x+=3) {\n      const i = (y*w+x)*4;\n      const r=data[i], g=data[i+1], b=data[i+2];\n      const gray = 0.299*r + 0.587*g + 0.114*b;\n      if (gray < 128) dark++; else light++;\n      total++;\n    }\n  }\n  console.log('dark pixels:', dark, '(' + (100*dark/total).toFixed(1) + '%)');\n  console.log('light pixels:', light, '(' + (100*light/total).toFixed(1) + '%)');\n}\nanalyze('figures/图2_1.jpg');\n\" 2>&1", "Bash=npm search mcp vision --json 2>/dev/null | node -e \"\nconst chunks=[];\nprocess.stdin.on('data',c=>chunks.push(c));\nprocess.stdin.on('end',()=>{\n  try {\n    const data=JSON.parse(Buffer.concat(chunks).toString());\n    (Array.isArray(data)?data:[]).slice(0,10).forEach(p=>console.log(p.name,'-',p.description?.substring(0,80)||''));\n  } catch(e) { console.log('parse error, trying raw'); }\n});\n\" 2>&1 | head -20", "Bash=node -e \"\nconst http = require('http');\n// Try to reach the mimo proxy with a simple vision request\nconst payload = JSON.stringify({\n  model: 'mimo-v2.5-pro',\n  messages: [{role:'user', content:'hello'}],\n  max_tokens: 10\n});\nconst req = http.request({\n  hostname: '127.0.0.1', port: 15721,\n  path: '/v1/chat/completions', method: 'POST',\n  headers: {'Content-Type':'application/json', 'Content-Length': Buffer.byteLength(payload)}\n}, res => {\n  let d='';\n  res.on('data', c => d+=c);\n  res.on('end', () => console.log('status:', res.statusCode, 'body:', d.substring(0,300)));\n});\nreq.on('error', e => console.log('error:', e.message));\nreq.write(payload);\nreq.end();\n\" 2>&1", "Bash=env | grep -i mimo 2>/dev/null; echo \"===\"; env | grep -i ANTHROPIC 2>/dev/null | head -10; echo \"===\"; cat /c/Users/UserName/.claude/settings.json 2>/dev/null", "Bash=command -v tesseract && tesseract --version 2>/dev/null | head -1; echo \"===\"; command -v ocrmypdf 2>/dev/null; echo \"===\"; command -v pdftotext 2>/dev/null; echo \"===\"; command -v pdftoppm 2>/dev/null", "Bash=node -e \"\n// Try to call a free vision API to describe an image\nconst fs = require('fs');\nconst img = fs.readFileSync('D:/Work/Problem-Solving-Book/舒幼生力学做题本/figures/图2_1.jpg');\nconst b64 = img.toString('base64');\nconsole.log('image base64 length:', b64.length);\nconsole.log('image size:', img.length, 'bytes');\n\n// Try calling a free OCR API\nfetch('https://api.ocr.space/parse/image', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n  body: 'base64Image=data:image/jpeg;base64,' + b64 + '&language=chs&isOverlayRequired=false'\n}).then(r => r.json()).then(d => {\n  console.log('OCR result:', JSON.stringify(d).substring(0,500));\n}).catch(e => console.log('OCR error:', e.message));\n\" 2>&1", "Bash=cd /d/Work/Problem-Solving-Book && node -e \"\nconst { Jimp } = require('jimp');\nasync function toAscii(path, w) {\n  const img = await Jimp.read(path);\n  const iw = img.bitmap.width, ih = img.bitmap.height;\n  const data = img.bitmap.data;\n  const h = Math.floor(ih / iw * w * 0.45);\n  const sx = iw / w, sy = ih / h;\n  const chars = ' .,:;+*%#@';\n  let out = '';\n  for (let y = 0; y < h; y++) {\n    let line = '';\n    for (let x = 0; x < w; x++) {\n      const px = Math.floor(x * sx), py = Math.floor(y * sy);\n      const i = (py * iw + px) * 4;\n      const g = (0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]) / 255;\n      line += chars[Math.min(Math.floor(g * (chars.length-1)), chars.length-1)];\n    }\n    out += line + '\\n';\n  }\n  return out;\n}\ntoAscii('舒幼生力学做题本/figures/图2_1.jpg', 50).then(console.log);\n\" 2>&1", "Bash=cd /d/Work/Problem-Solving-Book && node -e \"\nconst fs = require('fs');\nconst img = fs.readFileSync('舒幼生力学做题本/figures/图2_1.jpg');\nconst b64 = img.toString('base64');\n\n// Try Hugging Face free inference API (no key needed for some models)\nfetch('https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ inputs: 'data:image/jpeg;base64,' + b64 })\n}).then(r => { console.log('status:', r.status); return r.text(); })\n  .then(t => console.log('result:', t.substring(0,500)))\n  .catch(e => console.log('error:', e.message));\n\" 2>&1", "Bash=cd /d/Work/Problem-Solving-Book && for f in \"舒幼生力学做题本/figures/图1_2.jpg\" \"舒幼生力学做题本/figures/图1_8.jpg\" \"舒幼生力学做题本/figures/图3_1.jpg\" \"舒幼生力学做题本/figures/图5_1.jpg\"; do echo \"=== $(basename $f) ===\"; node _analyze_img.js \"$f\" 2>&1; echo; done", "Bash=cd /d/Work/Problem-Solving-Book && git status --short | head -40 && echo \"--- 共 $(git status --short | wc -l) 项\""]
