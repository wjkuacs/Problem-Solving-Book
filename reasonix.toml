  const BS = String.fromCharCode(92); // 标准反斜杠\n  // \\boldsymbol {X} 或 \\boldsymbol{X}\n  t = t.split(BS + 'boldsymbol').join(BS + 'vec');\n  stats.bs += (t.match(new RegExp(BS + 'vec', 'g')) || []).length;\n  fs.writeFileSync(file, t, 'utf8');\n}\nconsole.log('boldsymbol 替换完成');\nEOF\nnode fix_vec3.js && echo \"=== 检查残留 ===\"; grep -c 'boldsymbol' chapters/*.tex | grep -v ':0' || echo \"无残留\"; echo \"=== 检查结果 ===\"; grep -n 'vec {E}' chapters/chapter1.tex | head -2; grep -n 'boldsymbol' chapters/chapter1.tex | head -2 || echo \"已全部替换\"", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > fix_hat.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst chapters = fs.readdirSync('chapters').filter(f => f.endsWith('.tex'));\nlet n = 0;\nfor (const f of chapters) {\n  const file = path.join('chapters', f);\n  let t = fs.readFileSync(file, 'utf8');\n  const before = t.split('hat{e}').length - 1;\n  // 裸 hat{e} 补反斜杠（前面不是反斜杠时）\n  t = t.replace(/(^|[^\\\\])hat\\{e\\}/g, (m, p) => p + '\\\\hat{e}');\n  const after = t.split('hat{e}').length - 1;\n  n += before - after;\n  fs.writeFileSync(file, t, 'utf8');\n}\nconsole.log('修复 hat 反斜杠:', n, '处');\nEOF\nnode fix_hat.js && echo \"=== 验证 ===\"; grep -oh '\\\\hat{e}_{[^}]*}' chapters/*.tex | sort | uniq -c; echo \"=== 残留裸 hat ===\"; grep -n '[^\\\\]hat{' chapters/*.tex | head -5 || echo \"无\"", "Bash=cd \"D:/Work/Problem-Solving-Book/电磁学千题解做题本\" && cat > fix_hat2.js <<'EOF'\nconst fs = require('fs'), path = require('path');\nconst chapters = fs.readdirSync('chapters').filter(f => f.endsWith('.tex'));\nconst BS = String.fromCharCode(92);\nlet n = 0;\nfor (const f of chapters) {\n  const file = path.join('chapters', f);\n  let t = fs.readFileSync(file, 'utf8');\n  const needle = 'hat{e}';\n  const repl = BS + 'hat{e}';\n  // 只替换前面不是反斜杠的 hat{e}\n  let out = '', idx = 0;\n  while (true) {\n    const i = t.indexOf(needle, idx);\n    if (i < 0) { out += t.slice(idx); break; }\n    out += t.slice(idx, i);\n    co